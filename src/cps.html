<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPS Test - FluAutoClicker</title>
    <style>
      
      * {
        user-select: none !important;
        -webkit-user-select: none !important;
        -webkit-user-drag: none !important;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }

      body {
        background-color: var(--bg);
        border-radius: var(--radius);
        
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 10px 40px rgba(0,0,0,0.5);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
      }

      header {
        height: 40px;
        background: var(--surface);
        display: flex;
        position: relative;
        align-items: center;
        justify-content: space-between;
        padding: 0 6px;
        border-radius: 9px 9px 0 0;
        -webkit-app-region: drag;
        flex-shrink: 0;
        z-index: 100;
      }

      #app {
        flex: 1;
        overflow: hidden;
        padding: 8px 5px; 
        display: flex;
        flex-direction: column;
      }

      
      .header-tag {
        background: var(--control-bg);
        border-radius: var(--radius-sm);
        height: 28px;
        display: flex;
        align-items: center;
        padding: 0 12px;
        flex-shrink: 0;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        -webkit-app-region: no-drag;
        pointer-events: none;
      }

      .tag-text {
        font-family: var(--font);
        font-size: 13px;
        font-weight: 500;
        color: var(--accent);
        letter-spacing: -0.2px;
        opacity: 0.9;
      }

      #cps-click-area {
        flex: 1;
        margin: 5px 0;
        background: var(--surface);
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.05s ease, background 0.2s ease, margin 0.3s ease;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
        touch-action: manipulation;
        will-change: contents;
      }

      .section-row {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        max-height: 100px;
        opacity: 1;
        overflow: hidden;
      }

      body.high-performance-mode .section-row {
        max-height: 0;
        opacity: 0;
        margin: 0;
        padding: 0;
        pointer-events: none;
      }

      body.high-performance-mode #cps-click-area {
        margin: 0;
        border-radius: 0;
      }

      
      body.high-performance-mode * {
        text-shadow: none !important;
        box-shadow: none !important;
      }
      
      #cps-click-area:hover {
        background: var(--control-dark);
      }
      
      
      #cps-click-area.clicking {
        transform: scale(0.96);
        background: var(--control-dark);
        box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5);
      }

      .cps-ripple {
        position: absolute;
        width: 120px;
        height: 120px;
        background: var(--accent);
        border-radius: 50%;
        transform: scale(0);
        animation: cpsRipple 0.4s ease-out;
        pointer-events: none;
        opacity: 0.15;
      }
      @keyframes cpsRipple {
        to { transform: scale(3.5); opacity: 0; }
      }

      .cps-count-display {
        font-size: 54px;
        font-weight: 900;
        color: var(--accent);
        pointer-events: none;
        letter-spacing: -2px;
      }

      .cps-stat {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-dim);
        pointer-events: none;
        letter-spacing: -0.3px;
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }

      .cps-stat-max {
        position: absolute;
        top: 16px;
      }

      .cps-stat-min {
        position: absolute;
        bottom: 48px;
      }

      .cps-hint {
        position: absolute;
        bottom: 24px;
        font-size: 10px;
        color: var(--text-dim);
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: 1.5px;
        opacity: 0.6;
      }

      #cps-result-text {
        font-size: 11px;
        font-weight: 400;
        color: rgba(131, 131, 131, 1);
        font-family: var(--font);
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #cps-retry-btn {
        background: var(--control-bg);
        border: none;
        border-radius: 8px;
        padding: 4px 12px;
        font-family: var(--font);
        font-size: 12px;
        font-weight: 400;
        color: rgba(131, 131, 131, 1);
        cursor: pointer;
        transition: var(--transition);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        opacity: 0.3;
        pointer-events: none;
      }
      
      #cps-retry-btn.ready {
        opacity: 1;
        pointer-events: auto;
      }

      #cps-retry-btn.ready:hover {
        color: var(--accent);
        background: var(--control-dark);
      }

      #cps-retry-btn.ready:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <header data-tauri-drag-region>
      <div class="header-left" style="display: flex; align-items: center; -webkit-app-region: no-drag;">
        <div class="title-group">
          <span class="app-name font-logo" style="cursor: default;"><span style="color: var(--accent); transition: color 0.2s;">Flu</span><span style="color: var(--accent-dim); transition: color 0.2s;">AutoClicker</span></span>
        </div>
      </div>

      <div class="header-tag">
        <span class="tag-text" data-i18n="cps.test">CPS Test</span>
      </div>

      <div class="window-controls" style="-webkit-app-region: no-drag;">
        <button class="control-btn" id="minimize-btn" title="Minimize">
          <span class="window-control-glyph" aria-hidden="true">&#57627;</span>
        </button>
        <button class="control-btn" id="maximize-btn" title="Maximize" style="opacity: 0.5; cursor: default;">
          <span class="window-control-glyph" aria-hidden="true">&#57618;</span>
        </button>
        <button class="control-btn close" id="close-btn" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    </header>

    <main id="app">
      <div id="content" class="content-section active" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
        
        <div class="section-row" style="flex-shrink: 0;">
          <div class="multi-button-row" id="cps-mode-row" style="margin: 0; width: 100%;">
            <div class="slide-indicator" style="width: 50%; left: 0%;"></div>
            <button class="multi-btn active" data-value="click" data-i18n="cps.click_mode">Click</button>
            <button class="multi-btn" data-value="hold" data-i18n="cps.hold_mode">Hold</button>
          </div>
        </div>

        <div class="section-row" style="flex-shrink: 0;">
          <div class="multi-button-row" id="cps-time-row" style="margin: 0; width: 100%;">
            <div class="slide-indicator" style="width: 20%; left: 0%;"></div>
            <button class="multi-btn active" data-value="5">5s</button>
            <button class="multi-btn" data-value="10">10s</button>
            <button class="multi-btn" data-value="15">15s</button>
            <button class="multi-btn" data-value="25">25s</button>
            <button class="multi-btn" data-value="60">60s</button>
          </div>
        </div>

        <div id="cps-click-area">
          <div class="cps-stat cps-stat-max" id="cps-max-display">—</div>
          <div class="cps-count-display" id="cps-main-display">CLICK!</div>
          <div class="cps-stat cps-stat-min" id="cps-min-display">—</div>
          <div class="cps-hint" id="cps-status-hint">READY TO START • 5S</div>
        </div>

        <div class="section-row" style="flex-shrink: 0; margin-bottom: 0;">
          <div class="kb-status-row">
            <div style="display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1;">
              <span class="icon" style="color: var(--accent); opacity: 0.8; font-size: 14px; flex-shrink: 0; margin-top: 1px;">&#58487;</span>
              <span class="kb-status-text" id="cps-result-text" data-i18n="cps.loading_facts">LOADING FACTS...</span>
            </div>
            <button class="kb-record-btn" id="cps-retry-btn" data-i18n="cps.try_again">Try Again</button>
          </div>
        </div>

      </div>
    </main>

    <script type="module" src="scripts/cps.ts"></script>
  </body>
</html>
